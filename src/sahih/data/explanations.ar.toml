# Arabic explanations — الشروحات بالعربية
#
# STRUCTURE
# ---------
# Same keys as explanations.toml, one file per language. A translator works on this
# file alone and never has to touch the English or the code. Adding a language means
# adding a file, not restructuring anything.
#
# `terms` is deliberately NOT repeated here — business-term codes (IBT-048, BTAE-16)
# are language-independent identifiers and live once, in the English file.
#
# WHAT IS AND IS NOT TRANSLATED
# -----------------------------
# Only the rules that actually fire under the pint-ae profile. The 11 EN 16931
# entries marked dead in explanations.toml are not translated — translating text
# that can never appear in a result is exactly the waste we are trying to avoid.
#
# THE RULE SETS THEMSELVES ARE ENGLISH ONLY. OpenPeppol publishes no Arabic rule
# text, so an uncurated rule falls back to its English message even in Arabic mode.
# The UI says so rather than pretending otherwise.
#
# ⚠️ REVIEW NEEDED: these translations were drafted by the library author, not by a
# native speaker with UAE VAT experience. The terminology below follows FTA usage as
# far as we could establish it, but "الرقم الضريبي" vs "رقم التسجيل الضريبي" and
# similar choices should be confirmed by someone who files returns.

["ibr-104"]
summary = "الرقم الضريبي للمشتري مُكرَّر في الفاتورة."
why = """
لكل مشتري رقم ضريبي واحد في المعاملة الواحدة. ووجوده مرتين يعني عادةً أن المستند \
جُمِّع من مصادر متداخلة، ولا يستطيع النظام المستلم تحديد أيهما المعتمد، فيرفض الفاتورة \
بدلاً من التخمين."""
fix = "احذف الرقم الضريبي المكرر للمشتري. تظهر هذه المشكلة عادةً مع القاعدة الإماراتية ibr-179-ae لأنها تتحقق من الشرط نفسه — وإصلاح واحد يعالجهما معاً."

["ibr-179-ae"]
summary = "رقم التسجيل الضريبي للمشتري مذكور أكثر من مرة."
why = """
للمشتري تسجيل ضريبي واحد فقط في المعاملة الواحدة. والتكرار ينشأ غالباً عن نسخ بيانات \
الطرف مرتين أثناء تجميع المستند، أو عن إضافة نظامين للرقم نفسه. وفي الحالتين لا \
يستطيع المستلم معرفة أيهما المعتمد."""
fix = "احذف النسخة المكررة. ابحث عن كتلة PartyTaxScheme متكررة تحت بيانات المشتري — فهي السبب المعتاد، وغالباً ما تأتي من خطوة دمج أو قالب لا من إدخال البيانات."

["ibr-135-ae"]
summary = "يجب تعريف المشتري — إما برقم تعريف المشتري أو برقمه الضريبي — في هذا النوع من المعاملات."
why = """
تتطلب معظم أنواع المعاملات في الإمارات أن يكون المشتري قابلاً للتعريف، لأن الفاتورة \
تدعم مطالبته باسترداد ضريبة المدخلات. والاستثناء الأبرز هو التصدير، إذ يقع المشتري \
خارج نطاق ضريبة القيمة المضافة الإماراتية. فإن ظهرت هذه القاعدة على توريد محلي، فبيانات \
المشتري ناقصة."""
fix = "أضف رقم تعريف المشتري أو رقمه الضريبي. وإن كانت المعاملة تصديراً بالفعل، فتحقق من صحة رمز نوع المعاملة — فالقاعدة مشروطة به، وخطأ الرمز هو السبب الأرجح."

["ibr-149-ae"]
summary = "رقم التسجيل القانوني للمشتري مطلوب مع هذا الجمع بين معرّف المخطط والعنوان الإلكتروني."
why = """
عندما يُعرَّف المشتري من خلال مخطط معيّن، تشترط القواعد الإماراتية ذكر التسجيل القانوني \
الذي يستند إليه. فالعنوان الإلكتروني يحدد صندوق بريد، أما التسجيل القانوني فيحدد الكيان \
نفسه."""
fix = "أضف رقم التسجيل القانوني للمشتري. ونوع المستند الذي يشير إليه يعتمد على نوع التسجيل — راجع القاعدة ibr-183-ae للأنواع المسموح بها."

["ibr-183-ae"]
summary = "نوع رقم التسجيل القانوني للمشتري ليس من القيم المسموح بها في الإمارات."
why = """
يعترف نظام الفوترة الإلكترونية الإماراتي بمجموعة محددة ومغلقة من مستندات الهوية للمشتري. \
ويخبر حقل النوع كلاً من المستلم والهيئة الاتحادية للضرائب بنوع المستند الذي يشير إليه \
الرقم، ولذلك لا يمكن أن يكون نصاً حراً."""
fix = "اضبط نوع رقم التسجيل على إحدى القيم المسموح بها — الرخصة التجارية، أو الهوية الإماراتية، أو جواز السفر، أو قرار مجلس الوزراء — بما يطابق المستند الذي أُخذ منه الرقم فعلياً."

["ibr-101-ae"]
summary = "اسم الجهة المُصدِرة مفقود، وهو مطلوب عندما يُعرَّف المشتري برخصة تجارية."
why = """
تصدر الرخص التجارية في الإمارات عن جهات متعددة عبر الإمارات والمناطق الحرة. ورقم الرخصة \
وحده ليس فريداً — والجهة المُصدِرة هي ما يميّزه."""
fix = "أضف اسم الجهة التي أصدرت الرخصة التجارية للمشتري، مثل دائرة التنمية الاقتصادية المعنية أو هيئة المنطقة الحرة."

["ibr-010-ae"]
summary = "دولة إصدار جواز السفر مفقودة، وهي مطلوبة عندما يُعرَّف المشتري بجواز سفر."
why = """
رقم جواز السفر فريد داخل دولة إصداره فقط. وتعريف المشتري بجواز سفر دون ذكر الدولة \
المُصدِرة يترك الهوية غامضة."""
fix = "أضف رمز دولة إصدار جواز السفر بحرفين وفق معيار ISO 3166-1. يُحتاج هذا عادةً عند إصدار فاتورة لفرد وليس لمنشأة مسجلة."
